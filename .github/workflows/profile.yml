name: Refresh profile

on:
  schedule:
    - cron: "37 18 * * *"   # every day, ~00:07 IST
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main, master]
    paths:
      - "scripts/**"
      - "assets/ascii.txt"
      - ".github/workflows/profile.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 3D contribution calendar -> profile-3d-contrib/*.svg
      - name: Build 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # neofetch card -> assets/dark_mode.svg, assets/light_mode.svg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build neofetch card
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/build_card.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A profile-3d-contrib assets
          git diff --cached --quiet || git commit -m "chore: refresh profile card and 3D contributions"
          git push
